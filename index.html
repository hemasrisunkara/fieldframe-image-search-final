<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldframe — Image Search</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f6ef;
      color: #243d32;
    }

    header {
      padding: 24px 8%;
      border-bottom: 1px solid #deded2;
      font-weight: bold;
      letter-spacing: 2px;
    }

    main {
      max-width: 1100px;
      margin: 65px auto;
      padding: 0 22px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(38px, 6vw, 65px);
      margin-bottom: 12px;
    }

    .intro {
      color: #68766b;
      line-height: 1.6;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 30px 0 18px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border: 1px solid #c8cec4;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    button {
      padding: 15px 22px;
      background: #294b3b;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background: #193528; }

    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .suggestions button {
      background: #e5e9df;
      color: #294b3b;
      padding: 9px 14px;
    }

    #status {
      color: #68766b;
      margin: 24px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 14px #243d3210;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #e5e9df;
    }

    .card p {
      padding: 0 14px;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .card a {
      color: #294b3b;
      display: inline-block;
      margin: 0 14px 16px;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #68766b;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      form { flex-direction: column; }
      form button { width: 100%; }
      main { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <header>FIELDFRAME.</header>

  <main>
    <h1>Find your next<br>visual inspiration.</h1>
    <p class="intro">
      Explore beautiful images from around the world.<br>
      Search a subject and discover something new.
    </p>

    <form id="search-form">
      <input id="search-input" type="search"
        placeholder="Try forests, architecture, flowers..."
        aria-label="Search images" required>
      <button type="submit">Search images</button>
    </form>

    <div class="suggestions">
      <button type="button" data-query="forests">Forests</button>
      <button type="button" data-query="architecture">Architecture</button>
      <button type="button" data-query="flowers">Flowers</button>
      <button type="button" data-query="mountains">Mountains</button>
    </div>

    <p id="status" role="status">Search for something to get started.</p>
    <section id="results" class="grid" aria-label="Image results"></section>
  </main>

  <footer>FIELDFRAME · Made for curious minds</footer>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("search-input");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    async function searchImages(query) {
      if (!query.trim()) return;

      input.value = query;
      results.replaceChildren();
      status.textContent = "Searching for images...";

      try {
        const url =
          "https://commons.wikimedia.org/w/api.php" +
          "?action=query&format=json&origin=*" +
          "&generator=search&gsrsearch=" +
          encodeURIComponent("filetype:bitmap " + query) +
          "&gsrnamespace=6&gsrlimit=20" +
          "&prop=imageinfo&iiprop=url|extmetadata" +
          "&iiurlwidth=500";

        const response = await fetch(url);
        if (!response.ok) throw new Error("Search request failed.");

        const data = await response.json();
        const pages = Object.values(data.query?.pages || {});

        const images = pages.filter(page =>
          page.imageinfo?.[0]?.thumburl
        );

        if (!images.length) {
          status.textContent = "No images found. Try another search.";
          return;
        }

        status.textContent = `Found ${images.length} images for "${query}".`;

        images.forEach(page => {
          const info = page.imageinfo[0];
          const card = document.createElement("article");
          card.className = "card";

          const img = document.createElement("img");
          img.src = info.thumburl;
          img.alt = page.title.replace(/^File:/, "");
          img.loading = "lazy";

          const title = document.createElement("p");
          title.textContent = page.title.replace(/^File:/, "");

          const link = document.createElement("a");
          link.href = info.descriptionurl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "View image and details ↗";

          card.append(img, title, link);
          results.appendChild(card);
        });
      } catch (error) {
        status.textContent =
          "Couldn't load images. Check your internet connection and try again.";
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      searchImages(input.value);
    });

    document.querySelectorAll("[data-query]").forEach(button => {
      button.addEventListener("click", () => {
        searchImages(button.dataset.query);
      });
    });
  </script>
</body>
</html>
